name: hygiene

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run repository hygiene guard
        shell: pwsh
        run: ./scripts/hygiene/Test-RepositoryHygiene.ps1
