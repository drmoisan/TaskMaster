name: mstest-coverage

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mstest-coverage:
    name: Run MSTest suite with coverage
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      SOLUTION_PATH: TaskMaster.sln
      BUILD_CONFIGURATION: Debug
      BUILD_PLATFORM: Any CPU

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config') }}
            # The bare-prefix fallback below is safe against stale package
            # versions: `nuget restore` (next step) always runs unconditionally
            # and is idempotent per package for packages.config-style restores —
            # each package is materialized under a version-qualified directory
            # (packages/{id}.{version}/, matching every HintPath in this repo's
            # .csproj files). A fallback cache populated under an older
            # packages.config hash can therefore only ever contribute either
            # (a) version-folders that still match the current packages.config
            # (a legitimate, desired reuse) or (b) inert orphaned version-
            # folders for packages no longer referenced by any HintPath. Either
            # way, `nuget restore` fetches exactly the delta implied by the
            # current packages.config from the network before the build step
            # runs, so a fallback hit can never cause the build to compile
            # against a package version other than the one packages.config
            # names. See docs/features/active/2026-09-02-ci-build-infra-debt-730/
            # research/ for the full analysis (issue #730).
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore solution
        shell: pwsh
        run: nuget restore $env:SOLUTION_PATH

      - name: Build solution
        shell: pwsh
        run: |
          & msbuild $env:SOLUTION_PATH /t:Build /m /p:Configuration=Debug `
              "/p:Platform=Any CPU"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run MSTest suite with coverage
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $vswherePath = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswherePath)) {
              throw 'vswhere.exe was not found. Install Visual Studio 2022 (or Build Tools) with Test Platform components.'
          }

          $vstestPath = & $vswherePath -latest -products * -find 'Common7\IDE\Extensions\TestPlatform\vstest.console.exe' | Select-Object -First 1
          if (-not $vstestPath) {
              throw 'vstest.console.exe not found via vswhere. Install Visual Studio Test Platform components.'
          }

          $testAssemblies = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter '*.Test.dll' |
              Where-Object {
                  $_.FullName -match "\\bin\\$($env:BUILD_CONFIGURATION)\\" -and
                  $_.FullName -notmatch '\\obj\\' -and
                  $_.FullName -notmatch '\\ref\\'
              } |
              Select-Object -ExpandProperty FullName

          if (-not $testAssemblies -or $testAssemblies.Count -eq 0) {
              throw "No test assemblies found under '$env:GITHUB_WORKSPACE' for configuration '$env:BUILD_CONFIGURATION'."
          }

          New-Item -ItemType Directory -Path 'TestResults' -Force | Out-Null
          & $vstestPath $testAssemblies /EnableCodeCoverage /InIsolation /Logger:trx /TestCaseFilter:"TestCategory!=LiveOutlook"
          if ($LASTEXITCODE -ne 0) {
              throw "MSTest execution failed with exit code $LASTEXITCODE"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/*.coverage
          if-no-files-found: warn
