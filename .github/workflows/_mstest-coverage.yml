name: mstest-coverage

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mstest-coverage:
    name: Run MSTest suite with coverage
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      SOLUTION_PATH: TaskMaster.sln
      BUILD_CONFIGURATION: Debug
      BUILD_PLATFORM: Any CPU

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install dotnet-coverage
        shell: pwsh
        run: |
          # Pinned so a runner image bump cannot change the gate silently. The value is the
          # NuGet package version; the tool's own --version output carries a build-metadata
          # suffix that is not part of package identity and does not resolve with --version.
          dotnet tool install --global dotnet-coverage --version 18.10.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Made explicit rather than relying on the runner image default.
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          # Pinned: the tool that rewrites .csproj and app.config during an upgrade must be a known quantity for a given commit, and 7.9.0 is what the floating selector resolved to, so this freezes current behaviour rather than changing it.
          nuget-version: '7.9.0'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config') }}
            # The bare-prefix fallback below is safe against stale package
            # versions: `nuget restore` (next step) always runs unconditionally
            # and is idempotent per package for packages.config-style restores —
            # each package is materialized under a version-qualified directory
            # (packages/{id}.{version}/, matching every HintPath in this repo's
            # .csproj files). A fallback cache populated under an older
            # packages.config hash can therefore only ever contribute either
            # (a) version-folders that still match the current packages.config
            # (a legitimate, desired reuse) or (b) inert orphaned version-
            # folders for packages no longer referenced by any HintPath. Either
            # way, `nuget restore` fetches exactly the delta implied by the
            # current packages.config from the network before the build step
            # runs, so a fallback hit can never cause the build to compile
            # against a package version other than the one packages.config
            # names. See docs/features/active/2026-09-02-ci-build-infra-debt-730/
            # research/ for the full analysis (issue #730).
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore solution
        shell: pwsh
        run: nuget restore $env:SOLUTION_PATH

      - name: Build solution
        shell: pwsh
        run: |
          & msbuild $env:SOLUTION_PATH /t:Build /m /p:Configuration=Debug `
              "/p:Platform=Any CPU"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run MSTest suite with coverage
        shell: pwsh
        run: |
          # The local route is adopted verbatim so CI and the developer workstation run the same
          # code path. The script post-processes the collector output into a first-party Cobertura
          # projection and then asserts the line and branch floors against that projection, so the
          # gate's pass criterion now includes those two thresholds. Deliberate change: see
          # .github/workflows/README.md.
          & ./scripts/vscode/Invoke-MSTestWithCoverage.ps1 -SearchRoot . -Configuration Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload coverage document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/coverage.cobertura.xml
          if-no-files-found: error
