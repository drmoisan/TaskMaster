name: build-nullable

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-nullable:
    name: Build with nullable warnings treated as errors
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      SOLUTION_PATH: TaskMaster.sln
      BUILD_CONFIGURATION: Debug
      BUILD_PLATFORM: Any CPU

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          # Pinned: the tool that rewrites .csproj and app.config during an upgrade must be a known quantity for a given commit, and 7.9.0 is what the floating selector resolved to, so this freezes current behaviour rather than changing it.
          nuget-version: '7.9.0'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config') }}
            # No restore-keys fallback (issue #936). A fallback cache restored under an
            # older packages.config hash carries superseded packages/{id}.{version}/
            # folders, and those folders satisfy stale project-file paths (for example an
            # <Analyzer Include> left on an old version by a Dependabot bump). That hid a
            # clean-restore compile failure (CS0006) from every required check. An exact-key
            # miss now restores from scratch, so CI builds only what the manifests declare.

      - name: Restore solution
        shell: pwsh
        run: nuget restore $env:SOLUTION_PATH

      - name: Build with nullable warnings treated as errors
        shell: pwsh
        run: |
          # Use /t:Rebuild (not /t:Build) so this step always performs a genuine full
          # recompile. Enforcement now relies entirely on each file's own #nullable
          # enable pragma (the repo's per-file opt-in convention; UtilitiesCS.csproj and
          # SVGControl.csproj carry no project-level <Nullable> element) plus
          # /p:TreatWarningsAsErrors=true. MSBuild's incremental up-to-date check does
          # not invalidate on this command-line property change alone, so a plain
          # /t:Build would silently skip recompilation and never enforce this gate.
          & msbuild $env:SOLUTION_PATH /t:Rebuild /m /p:Configuration=Debug `
              "/p:Platform=Any CPU" `
              /p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
