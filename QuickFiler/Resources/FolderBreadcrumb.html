<!DOCTYPE html>
<!--
  QuickFiler breadcrumb page (#351, #400). Self-contained: inline CSS + JS, no external fetches or
  third-party libraries. Rendering is driven by host bridge messages over window.chrome.webview.
-->
<html lang="en" data-mode="collapsed" data-view-mode="collapsed">
<head>
<meta charset="utf-8" />
<title>Folder Breadcrumb</title>
<style>
  :root {
    --bc-back: #ffffff;
    --bc-fore: #1b1b1b;
    --bc-sel-back: #cce4f7;
    --bc-sel-fore: #1b1b1b;
    --bc-arrow: #767676;
    --bc-affordance: #0060b0;
    --bc-pct: #444444;
    --bc-sub-back: #f4f4f4;
    --bc-button-border: #767676;
    --bc-button-hover: #e5f1fb;
  }
  :root[data-theme="dark"] {
    --bc-back: #1e1e1e;
    --bc-fore: #e6e6e6;
    --bc-sel-back: #264f78;
    --bc-sel-fore: #ffffff;
    --bc-arrow: #9d9d9d;
    --bc-affordance: #6cb6ff;
    --bc-pct: #c8c8c8;
    --bc-sub-back: #2a2a2a;
    --bc-button-border: #9d9d9d;
    --bc-button-hover: #333333;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bc-back: #1e1e1e;
      --bc-fore: #e6e6e6;
      --bc-sel-back: #264f78;
      --bc-sel-fore: #ffffff;
      --bc-arrow: #9d9d9d;
      --bc-affordance: #6cb6ff;
      --bc-pct: #c8c8c8;
      --bc-sub-back: #2a2a2a;
      --bc-button-border: #9d9d9d;
      --bc-button-hover: #333333;
    }
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bc-back);
    color: var(--bc-fore);
    font-family: "Segoe UI", sans-serif;
    font-size: 13px;
    overflow-x: hidden;
  }
  :root[data-mode="collapsed"],
  :root[data-mode="collapsed"] body,
  :root[data-mode="collapsed"] #list {
    overflow-y: hidden;
  }
  #selector {
    box-sizing: border-box;
    display: flex;
    min-width: 0;
    width: 100%;
  }
  #list {
    box-sizing: border-box;
    min-width: 0;
    outline: none;
  }
  :root[data-mode="collapsed"] #list {
    flex: 1 1 auto;
  }
  :root[data-mode="expanded"] #list {
    flex: 1 1 100%;
    width: 100%;
  }
  #dropDownButton {
    align-self: stretch;
    appearance: none;
    background: var(--bc-back);
    border: 1px solid var(--bc-button-border);
    box-sizing: border-box;
    color: var(--bc-fore);
    flex: 0 0 24px;
    font: inherit;
    min-height: 22px;
    padding: 0;
  }
  #dropDownButton:hover,
  #dropDownButton:focus-visible {
    background: var(--bc-button-hover);
  }
  :root[data-mode="expanded"] #dropDownButton {
    display: none;
  }
  .row {
    align-items: center;
    box-sizing: border-box;
    cursor: default;
    display: flex;
    min-width: 0;
    padding: 2px 4px;
    white-space: nowrap;
  }
  .row.selected,
  .row.active {
    background: var(--bc-sel-back);
    color: var(--bc-sel-fore);
  }
  .crumbs {
    align-items: center;
    display: flex;
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .seg {
    flex: 0 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .seg.trunc { flex: 0 10 auto; min-width: 2ch; }
  .arrow { flex: 0 0 auto; padding: 0 3px; color: var(--bc-arrow); }
  .aff {
    color: var(--bc-affordance);
    cursor: pointer;
    flex: 0 0 auto;
    font-weight: bold;
    padding: 0 4px;
  }
  .pct {
    color: var(--bc-pct);
    flex: 0 0 auto;
    flex-shrink: 0;
    margin-left: auto;
    min-width: 5ch;
    text-align: right;
  }
  .row.selected .pct,
  .row.active .pct {
    color: var(--bc-sel-fore);
  }
  .subs { background: var(--bc-sub-back); }
  .sub {
    align-items: center;
    cursor: default;
    display: flex;
    padding: 1px 4px 1px 24px;
    white-space: nowrap;
  }
  .sub.selected { background: var(--bc-sel-back); color: var(--bc-sel-fore); }
</style>
</head>
<body>
<div id="selector">
  <div id="list" tabindex="0" aria-label="Folder list"></div>
  <button
    id="dropDownButton"
    type="button"
    aria-label="Open folder list"
    aria-haspopup="listbox"
    aria-controls="list"
    aria-expanded="false"
  ><span aria-hidden="true">&#x25BC;</span></button>
</div>
<script>
"use strict";
(function () {
  var list = document.getElementById("list");
  var dropDownButton = document.getElementById("dropDownButton");
  var state = {
    rows: [],
    options: [],
    selectedRowIndex: -1,
    selectedSubfolderIndex: -1,
    viewMode: "collapsed",
    isOpen: false,
    committedIdentity: null,
    pendingIdentity: null
  };

  function post(msg) {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(msg);
    }
  }

  function selectedRow() {
    return state.rows.find(function (row) { return row.selected; }) || null;
  }

  function optionForRow(row) {
    return state.options[row.rowIndex] || null;
  }

  function applySelectorOptions() {
    state.rows.forEach(function (row) {
      var option = optionForRow(row);
      row.identity = option && typeof option.identity === "string" ? option.identity : null;
      row.isSelectable = option ? option.isSelectable === true : false;
    });
  }

  function visibleRows() {
    if (state.viewMode !== "collapsed") {
      return state.rows;
    }

    var selectedRows = state.rows.filter(function (row) { return row.selected; }).slice(0, 1);
    if (state.committedIdentity === null) {
      return selectedRows;
    }

    var committedRows = state.rows.filter(function (row) {
      return row.isSelectable && row.identity === state.committedIdentity;
    }).slice(0, 1);
    return committedRows.length === 1 ? committedRows : selectedRows;
  }

  function rowHasOpenAffordance(row) {
    return row.cells.some(function (cell) { return cell.kind === "plus"; });
  }

  function makeCell(row, cell) {
    var element;
    if (cell.kind === "segment") {
      element = document.createElement("span");
      element.className = cell.truncationEligible ? "seg trunc" : "seg";
      element.textContent = cell.text;
      element.title = cell.text;
      element.addEventListener("dblclick", function (event) {
        event.stopPropagation();
        post({ type: "segmentDoubleClick", rowIndex: row.rowIndex, segmentIndex: cell.segmentIndex });
      });
    } else if (cell.kind === "arrow") {
      element = document.createElement("span");
      element.className = "arrow";
      element.textContent = "→";
    } else {
      element = document.createElement("span");
      element.className = "aff";
      element.textContent = cell.kind === "plus" ? "+" : "−";
      element.addEventListener("click", function (event) {
        event.stopPropagation();
        post({ type: "affordanceToggle", rowIndex: row.rowIndex });
      });
    }
    return element;
  }

  function makeRow(row) {
    var expanded = state.viewMode === "expanded";
    var active = expanded && row.isSelectable && row.identity === state.pendingIdentity;
    var rowElement = document.createElement("div");
    rowElement.className = active
      ? "row active"
      : (!expanded && row.selected && state.selectedSubfolderIndex < 0 ? "row selected" : "row");

    if (expanded && row.isSelectable) {
      rowElement.id = "folder-option-" + row.rowIndex;
      rowElement.setAttribute("role", "option");
      rowElement.setAttribute("aria-selected", String(active));
      rowElement.addEventListener("click", function () {
        post({ type: "selectorActivate", identity: row.identity });
      });
    }

    var crumbs = document.createElement("div");
    crumbs.className = "crumbs";
    row.cells.forEach(function (cell) { crumbs.appendChild(makeCell(row, cell)); });
    rowElement.appendChild(crumbs);

    var pct = document.createElement("span");
    pct.className = "pct";
    pct.textContent = row.percentText;
    rowElement.appendChild(pct);
    return rowElement;
  }

  function makeSubfolders(row) {
    var subs = document.createElement("div");
    subs.className = "subs";
    row.subfolders.forEach(function (subfolder, index) {
      var subfolderElement = document.createElement("div");
      subfolderElement.className =
        row.selected && state.selectedSubfolderIndex === index ? "sub selected" : "sub";
      var name = document.createElement("span");
      name.className = "seg";
      name.textContent = subfolder.displayName;
      name.title = subfolder.folderPath;
      subfolderElement.appendChild(name);
      subfolderElement.addEventListener("click", function (event) {
        event.stopPropagation();
        post({ type: "selectionChange", rowIndex: row.rowIndex, subfolderIndex: index });
      });
      subs.appendChild(subfolderElement);
    });
    return subs;
  }

  function render() {
    var activeRow = null;
    applySelectorOptions();
    list.textContent = "";

    if (state.viewMode === "expanded") {
      list.setAttribute("role", "listbox");
    } else {
      list.removeAttribute("role");
    }
    list.removeAttribute("aria-activedescendant");

    visibleRows().forEach(function (row) {
      var rowElement = makeRow(row);
      list.appendChild(rowElement);
      if (rowElement.classList.contains("active")) {
        activeRow = rowElement;
      }
      if (
        state.viewMode === "expanded" &&
        row.leafExpanded &&
        row.subfolders.length > 0
      ) {
        list.appendChild(makeSubfolders(row));
      }
    });

    if (state.viewMode === "expanded" && activeRow !== null) {
      var activeId = activeRow.id;
      list.setAttribute("aria-activedescendant", activeId);
      activeRow.scrollIntoView({ block: "nearest" });
    }
  }

  function onArrow(direction) {
    var row = selectedRow();
    var canRight =
      row !== null && (row.collapsed || (!row.leafExpanded && rowHasOpenAffordance(row)));
    var canLeft = row !== null && row.leafExpanded;
    var can = direction === "right" ? canRight : canLeft;
    post(can
      ? { type: "arrowKey", direction: direction }
      : { type: "unhandledArrow", direction: direction });
  }

  var selectorKeys = {
    ArrowUp: "up",
    ArrowDown: "down",
    Enter: "enter",
    Escape: "escape"
  };

  function handleKeyDown(event) {
    if (Object.prototype.hasOwnProperty.call(selectorKeys, event.key)) {
      event.preventDefault();
      post({ type: "selectorKey", key: selectorKeys[event.key] });
      return;
    }

    if (event.key === "ArrowRight") {
      event.preventDefault();
      onArrow("right");
    } else if (event.key === "ArrowLeft") {
      event.preventDefault();
      onArrow("left");
    }
  }

  function focusForMode() {
    if (state.viewMode === "expanded") {
      list.focus();
    } else {
      dropDownButton.focus();
    }
  }

  list.addEventListener("keydown", handleKeyDown);
  dropDownButton.addEventListener("keydown", handleKeyDown);
  dropDownButton.addEventListener("click", function () {
    post({ type: "selectorToggle" });
  });
  window.addEventListener("focus", focusForMode);

  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener("message", function (event) {
      var msg = event.data;
      if (!msg || typeof msg.type !== "string") {
        return;
      }

      if (msg.type === "render") {
        state.rows = msg.rows || [];
        var selected = selectedRow();
        state.selectedRowIndex = selected ? selected.rowIndex : -1;
        render();
      } else if (msg.type === "selectorView") {
        state.viewMode = msg.mode === "expanded" ? "expanded" : "collapsed";
        state.isOpen = msg.isOpen === true;
        state.committedIdentity = msg.committedIdentity || null;
        state.pendingIdentity = msg.pendingIdentity || null;
        state.options = Array.isArray(msg.options) ? msg.options : [];
        document.documentElement.setAttribute("data-mode", state.viewMode);
        document.documentElement.setAttribute("data-view-mode", state.viewMode);
        dropDownButton.setAttribute("aria-expanded", String(state.isOpen));
        render();
      } else if (msg.type === "themeChange") {
        document.documentElement.setAttribute(
          "data-theme",
          msg.theme === "dark" ? "dark" : "light"
        );
      } else if (msg.type === "selectionChange") {
        state.selectedSubfolderIndex =
          typeof msg.subfolderIndex === "number" ? msg.subfolderIndex : -1;
      }
    });
  }
})();
</script>
</body>
</html>
