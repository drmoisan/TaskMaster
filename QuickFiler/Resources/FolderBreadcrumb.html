<!DOCTYPE html>
<!--
  QuickFiler breadcrumb page (#351, #400). Self-contained: inline CSS + JS, no external fetches or
  third-party libraries. Rendering is driven by host bridge messages over window.chrome.webview.
-->
<html lang="en" data-mode="collapsed" data-view-mode="collapsed">
<head>
<meta charset="utf-8" />
<title>Folder Breadcrumb</title>
<style>
  :root {
    --bc-back: #ffffff;
    --bc-fore: #1b1b1b;
    --bc-sel-back: #cce4f7;
    --bc-sel-fore: #1b1b1b;
    --bc-arrow: #767676;
    --bc-affordance: #0060b0;
    --bc-pct: #444444;
    --bc-sub-back: #f4f4f4;
    --bc-button-border: #767676;
    --bc-button-hover: #e5f1fb;
  }
  :root[data-theme="dark"] {
    --bc-back: #1e1e1e;
    --bc-fore: #e6e6e6;
    --bc-sel-back: #264f78;
    --bc-sel-fore: #ffffff;
    --bc-arrow: #9d9d9d;
    --bc-affordance: #6cb6ff;
    --bc-pct: #c8c8c8;
    --bc-sub-back: #2a2a2a;
    --bc-button-border: #9d9d9d;
    --bc-button-hover: #333333;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) {
      --bc-back: #1e1e1e;
      --bc-fore: #e6e6e6;
      --bc-sel-back: #264f78;
      --bc-sel-fore: #ffffff;
      --bc-arrow: #9d9d9d;
      --bc-affordance: #6cb6ff;
      --bc-pct: #c8c8c8;
      --bc-sub-back: #2a2a2a;
      --bc-button-border: #9d9d9d;
      --bc-button-hover: #333333;
    }
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bc-back);
    color: var(--bc-fore);
    font-family: "Segoe UI", sans-serif;
    font-size: 13px;
    overflow-x: hidden;
  }
  :root[data-mode="collapsed"],
  :root[data-mode="collapsed"] body,
  :root[data-mode="collapsed"] #list {
    overflow-y: hidden;
  }
  #selector {
    box-sizing: border-box;
    display: flex;
    min-width: 0;
    width: 100%;
  }
  #list {
    box-sizing: border-box;
    min-width: 0;
    outline: none;
  }
  :root[data-mode="collapsed"] #list {
    flex: 1 1 auto;
  }
  :root[data-mode="expanded"] #list {
    flex: 1 1 100%;
    width: 100%;
  }
  #dropDownButton {
    align-self: stretch;
    appearance: none;
    background: var(--bc-back);
    border: 1px solid var(--bc-button-border);
    box-sizing: border-box;
    color: var(--bc-fore);
    flex: 0 0 24px;
    font: inherit;
    min-height: 22px;
    padding: 0;
  }
  #dropDownButton:hover,
  #dropDownButton:focus-visible {
    background: var(--bc-button-hover);
  }
  :root[data-mode="expanded"] #dropDownButton {
    display: none;
  }
  .row {
    align-items: center;
    box-sizing: border-box;
    cursor: default;
    display: flex;
    min-width: 0;
    padding: 2px 4px;
    white-space: nowrap;
  }
  .row.selected,
  .row.active {
    background: var(--bc-sel-back);
    color: var(--bc-sel-fore);
  }
  .crumbs {
    align-items: center;
    display: flex;
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .seg {
    flex: 0 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .seg.trunc { flex: 0 10 auto; min-width: 2ch; }
  .arrow { flex: 0 0 auto; padding: 0 3px; color: var(--bc-arrow); }
  .aff {
    color: var(--bc-affordance);
    cursor: pointer;
    flex: 0 0 auto;
    font-weight: bold;
    padding: 0 4px;
  }
  .pct {
    color: var(--bc-pct);
    flex: 0 0 auto;
    flex-shrink: 0;
    margin-left: auto;
    min-width: 5ch;
    text-align: right;
  }
  .row.selected .pct,
  .row.active .pct {
    color: var(--bc-sel-fore);
  }
  .subs { background: var(--bc-sub-back); }
  .sub {
    align-items: center;
    cursor: default;
    display: flex;
    padding: 1px 4px 1px 24px;
    white-space: nowrap;
  }
  .sub.selected, .sub.active { background: var(--bc-sel-back); color: var(--bc-sel-fore); }
</style>
</head>
<body>
<div id="selector">
  <div id="list" tabindex="0" aria-label="Folder list"></div>
  <button
    id="dropDownButton"
    type="button"
    aria-label="Open folder list"
    aria-haspopup="listbox"
    aria-controls="list"
    aria-expanded="false"
  ><span aria-hidden="true">&#x25BC;</span></button>
</div>
<script>
/*FOLDER_BREADCRUMB_SCRIPT*/
</script>
</body>
</html>
